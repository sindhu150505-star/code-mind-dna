services:
  - type: web
    name: codemind-dna-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health/live
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://codemind-dna-frontend.onrender.com
      - key: ADMIN_PHONE_NUMBERS
        sync: false
  - type: web
    name: codemind-dna-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://codemind-dna-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
